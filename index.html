<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9bd36">
<meta name="robots" content="noindex">
<title>Professor Mycels Biolabb</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23e9bd36'/%3E%3Cpath d='M9 26c0-8 6.500-13 15-13s15 5 15 13z' fill='%231c170d'/%3E%3Cpath d='M20 26h8v8c0 2-1.500 3-3 3h-2c-1.500 0-3-1-3-3z' fill='%231c170d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-ok" viewBox="0 0 24 24"><path d="M4 12.5l5.2 5.3L20 6" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-bad" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/></symbol>
</svg>

<div class="app">
  <header class="masthead">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M24 3C12.4 3 4 10.4 4 19.6c0 5.1 2.5 9.6 6.6 12.6L8.5 44l10.6-6c1.5.3 3.2.5 4.9.5 11.6 0 20-7.4 20-16.9S35.6 3 24 3z" fill="none" stroke="#1c170d" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M12.5 22.5c0-6.3 5-10.5 11.5-10.5s11.500 4.200 11.500 10.500z" fill="#1c170d"/>
      <path d="M20.500 22.500h7v5.500c0 1.300-1 2.200-2.300 2.200h-2.400c-1.300 0-2.300-.9-2.300-2.200z" fill="#1c170d"/>
      <circle cx="19" cy="18" r="1.700" fill="#e9bd36"/><circle cx="25.500" cy="16.200" r="1.500" fill="#e9bd36"/><circle cx="30" cy="19.800" r="1.300" fill="#e9bd36"/>
    </svg>
    <p class="kicker display">Professor</p>
    <h1 class="display">Mycels biolabb</h1>
  </header>

  <div class="status" aria-live="polite">
    <p class="hint" id="hint">Tryck på en symbol</p>
    <div class="verdict" id="verdict" hidden>
      <p class="verdict-title display" id="verdictTitle"></p>
      <p class="verdict-sub" id="verdictSub"></p>
      <p class="verdict-sign" id="verdictSign" hidden>– Professor Mycel</p>
    </div>
  </div>

  <main class="note">
    <div class="grid" id="grid"></div>

    <section class="prize" id="prize" aria-labelledby="prizeTitle" hidden>
      <h2 class="prize-title display" id="prizeTitle" tabindex="-1"></h2>
      <p class="prize-intro" id="prizeIntro"></p>
      <form id="prizeForm" novalidate>
        <label class="field" for="email">E-postadress</label>
        <input class="email" id="email" name="email" type="email" inputmode="email" autocomplete="email"
               autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="254" placeholder="namn@exempel.se">
        <div class="hp" aria-hidden="true"><label>Lämna tomt <input type="text" id="website" name="website" tabindex="-1" autocomplete="off"></label></div>
        <label class="consent">
          <input type="checkbox" id="consent">
          <span class="box" aria-hidden="true"></span>
          <span id="consentText"></span>
        </label>
        <p class="privacy" id="privacyNote"></p>
        <p class="privacy privacy-more" id="privacyMore"><span id="privacyMoreText"></span> <a id="privacyLink" target="_blank" rel="noopener noreferrer"></a>.</p>
        <p class="form-error" id="formError" role="alert" hidden></p>
        <button class="send display" id="send" type="submit" disabled>Skicka</button>
      </form>
      <button class="skip" id="skip" type="button">Nej tack</button>
    </section>

    <section class="thanks" id="thanks" hidden>
      <p class="thanks-text display" id="thanksText" tabindex="-1"></p>
    </section>
  </main>

  <button class="reset" id="reset" type="button" hidden>Börja om</button>
</div>

<div class="dock" id="dock">
  <button class="cta display" id="check" type="button">Kontrollera</button>
</div>

<div class="picker" id="picker" hidden>
  <div class="picker-note" role="dialog" aria-modal="true" aria-labelledby="pTitle">
    <button class="close" id="close" type="button" aria-label="Stäng">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="#1c170d" stroke-width="3" stroke-linecap="round"/></svg>
    </button>
    <img class="p-sym" id="pSym" alt="">
    <h2 class="p-title display" id="pTitle"></h2>
    <p class="p-question" id="pQuestion"></p>
    <div class="options" id="options"></div>
  </div>
</div>

<script src="quiz.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
